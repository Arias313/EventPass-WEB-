<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="apple-touch-icon" href="../icons/icon-192x192.png" />
  <link rel="manifest" href="../manifest.json" />
  <title>Acceso administrador — EventPass</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .tabs { display: flex; gap: 4px; margin-bottom: 22px; background: var(--bg-raised); border-radius: var(--radius-sm); padding: 4px; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 9px; border-radius: 6px; font-family: var(--font-body); font-weight: 600; font-size: .88rem; cursor: pointer; }
    .tab-btn.is-active { background: var(--primary); color: #fff; }
    .auth-form { display: none; }
    .auth-form.is-active { display: block; }
    .auth-error { display: none; background: rgba(248,113,113,.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: .86rem; margin-bottom: 16px; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <a href="../index.html" class="back-link">← EventPass</a>
      <div id="connection-status" class="status-online">● En línea</div>
    </div>
  </header>

  <main class="page-main" style="max-width:440px;">
    <p class="page-eyebrow">Panel de administración</p>
    <h1 class="page-title">Acceso de organizadores</h1>
    <p class="page-lead">Inicia sesión para crear y administrar tus eventos.</p>

    <div class="tabs">
      <button class="tab-btn is-active" id="tab-login">Iniciar sesión</button>
      <button class="tab-btn" id="tab-registro">Crear cuenta</button>
    </div>

    <p class="auth-error" id="auth-error"></p>

    <!-- Login -->
    <form id="form-login" class="form-card auth-form is-active">
      <div class="field">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
    </form>

    <!-- Registro -->
    <form id="form-registro-admin" class="form-card auth-form">
      <div class="field">
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="reg-email">Correo electrónico</label>
        <input type="email" id="reg-email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" autocomplete="new-password" minlength="6" required />
        <p class="field-error" style="display:block; color:var(--text-faint);">Mínimo 6 caracteres.</p>
      </div>
      <button type="submit" class="btn-primary" id="btn-registro-admin">Crear cuenta</button>
    </form>
  </main>

  <footer class="app-footer">
    <p>EventPass &copy; 2026 — Panel de administración</p>
  </footer>

<!-- 1. Configuración de API (Primero) -->
  <script src="../js/config.js"></script>

  <!-- 2. Scripts del sistema -->
  <script src="../js/api-store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
