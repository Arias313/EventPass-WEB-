<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020618">
  <title>Iniciar sesión — EventPass</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Estilos enfocados en conversión (Minimalista) */
    body {
      background-color: var(--color-midnight-panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .auth-header {
      margin-top: 60px;
      margin-bottom: 30px;
      text-align: center;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--color-deep-slate);
      padding: 40px 32px;
      border: 1px solid var(--color-steel-outline);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 60px;
      box-sizing: border-box;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title h1 {
      font-size: 1.8rem;
      color: var(--color-signal-white);
      margin: 0 0 12px 0;
    }

    .auth-title p {
      font-size: 0.95rem;
      color: var(--color-signal-white);
      margin: 0;
    }
    
    .auth-title a {
      color: var(--color-nuxt-signal);
      text-decoration: none;
      font-weight: 500;
    }
    
    .auth-title a:hover {
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      background: var(--color-midnight-panel);
      border: 1px solid var(--color-steel-outline);
      border-radius: 8px;
      color: var(--color-signal-white);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      border-color: var(--color-nuxt-signal);
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }

    .auth-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-muted-fog);
      cursor: pointer;
    }

    .auth-options a {
      color: var(--color-nuxt-signal);
      text-decoration: none;
      font-weight: 500;
    }

    .btn-submit {
      width: 100%;
      background: var(--color-nuxt-signal);
      color: #000;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }
    
    .err {
      color: #ff4d4d;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 15px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- Logo Centrado -->
  <header class="auth-header">
    <a href="../index.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 10px;">
      <span style="color: var(--color-nuxt-signal); font-size: 2rem;">◈</span>
      <span style="color: var(--color-signal-white); font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px;">EventPass</span>
    </a>
  </header>

  <main class="auth-container">
    
    <div class="auth-title">
      <h1>Hola de nuevo</h1>
      <p>¿Aún no tienes cuenta? <a href="registro-admin.html">Regístrate</a></p>
    </div>

    <form id="f" novalidate>
      <div class="form-group">
        <input id="u" type="email" class="form-input" placeholder="Correo del trabajo" autocomplete="username" required>
      </div>
      
      <div class="form-group">
        <input id="p" type="password" class="form-input" placeholder="Contraseña" autocomplete="current-password" required>
      </div>

      <div class="auth-options">
        <label>
          <input id="remember-session" type="checkbox"> Mantener la sesión iniciada
        </label>
        <a href="#" onclick="alert('Funcionalidad de recuperación en construcción para la V2'); return false;">¿Has olvidado tu contraseña?</a>
      </div>

      <div class="err" id="e"></div>
      
      <button type="submit" class="btn-submit">INICIAR SESIÓN</button>
    </form>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const loginForm = document.getElementById("f");
    const loginError = document.getElementById("e");
    if (typeof EPStore === "undefined") {
      loginError.textContent = "No se cargó js/api-store.js, revisa la consola";
      loginForm.querySelector("button[type=submit]").disabled = true;
    } else {
      loginForm.onsubmit = async (e) => {
        e.preventDefault();
        const inputEmail = document.getElementById("u").value.trim();
        const inputPass = document.getElementById("p").value;
        const rememberSession = document.getElementById("remember-session").checked;

        try {
          await EPStore.login(inputEmail, inputPass, rememberSession);
          window.location.href = "../index-administrador.html";
        } catch (error) {
          loginError.textContent =
            error.message || "No se pudo iniciar sesión. Comprueba tu conexión e inténtalo de nuevo.";
        }
      };
    }
  </script>
</body>
</html>
