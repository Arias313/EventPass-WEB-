<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020618">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.json">
  <title>Tu pase — EventPass</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px;">
    <!-- Logo funciona como botón de regreso al inicio -->
    <a href="../index.html" class="logo" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
      <span class="logo-icon">◈</span>
      <span class="logo-text">EventPass</span>
    </a>
    
    <div id="connection-status" class="status-online" style="font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap;">
      ● En línea
    </div>
  </div>
</header>

<main class="wrap narrow">
  <div class="panel ticket" id="t"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api-store.js"></script>
<script src="../js/app.js"></script>
<script>
const {esc,param,toast,pin} = EPUtil;
const t = document.getElementById("t");
const a = EPStore.getAsistente(param("id"));
const ev = a && EPStore.getEvento(a.eventoId);

if(!a || !ev) {
  t.innerHTML = `<h1>Pase no encontrado</h1><p class="meta">Vuelve al link de registro del evento para generar uno.</p>`;
} else {
  const pinCode = pin(a.id);
  t.innerHTML = `
    <span class="logo-icon">◈</span><div class="meta">${esc(ev.nombre)}</div>
    <h1>${esc(a.nombre)}</h1><div class="meta">CC ${esc(a.cedula)}</div>
    <div class="tear"></div>
    <canvas id="qr-canvas" aria-label="Código QR del pase" style="margin: 16px auto; border-radius: 8px;"></canvas>
    <p id="qr-status" class="meta" role="status" aria-live="polite">Generando código QR…</p>
    <div class="pin-row">
      <div><span class="meta">PIN de entrada</span><strong class="pin-code" id="pin-code">${esc(pinCode)}</strong></div>
      <button class="btn-secondary btn-sm" id="copy-pin" type="button">Copiar PIN</button>
    </div>
    <p class="meta">${esc(ev.lugar)}${ev.fecha ? " · " + new Date(ev.fecha).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short"}) : ""}<br>Pase ${esc(a.id)}</p>
    <div class="no-print row" style="justify-content:center; gap: 8px; margin-top: 16px;">
      <button class="btn-primary btn-sm" id="dl" type="button" disabled>Descargar QR</button>
      <button class="btn-secondary btn-sm" id="pwa">Guardar en inicio</button>
    </div>
    <!-- Botón Volver agregado -->
    <a href="../index.html" class="btn-secondary no-print" style="display: block; width: 100%; text-align: center; margin-top: 24px; padding: 12px; text-decoration: none; border-radius: 8px; box-sizing: border-box;">
      ← Volver al inicio
    </a>
  `;
  
  const cv = document.getElementById("qr-canvas");
  const qrStatus = document.getElementById("qr-status");
  const downloadButton = document.getElementById("dl");
  const qrPromise = new Promise((resolve, reject) => {
    if (!window.QRCode || typeof window.QRCode.toCanvas !== "function") {
      reject(new Error("La librería QRCode.js no está disponible."));
      return;
    }
    window.QRCode.toCanvas(cv, EPStore.qrPayload(a), {
      width: 220,
      margin: 2,
      color: { dark: "#000000", light: "#ffffff" }
    }, error => error ? reject(error) : resolve());
  }).then(() => {
    qrStatus.hidden = true;
    downloadButton.disabled = false;
  }).catch(error => {
    console.error("Error generando QR:", error);
    qrStatus.textContent = "No se pudo generar el QR. Comprueba tu conexión e inténtalo de nuevo.";
  });

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (error) {
      // Prueba el método compatible con navegadores sin permiso de Clipboard API.
    }

    const field = document.createElement("textarea");
    field.value = text;
    field.setAttribute("readonly", "");
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand("copy");
    field.remove();
    return copied;
  }

  document.getElementById("copy-pin").addEventListener("click", async () => {
    if (await copyText(pinCode)) toast("PIN copiado");
    else prompt("Copia el PIN:", pinCode);
  });

  downloadButton.addEventListener("click", async () => {
    await qrPromise;
    if (downloadButton.disabled) return;

    const l = document.createElement("a");
    const fileId = String(a.cedula || a.id).replace(/[^a-z0-9_-]/gi, "-");
    l.download = `pase-${fileId}.png`;
    const blob = typeof cv.toBlob === "function"
      ? await new Promise(resolve => cv.toBlob(resolve, "image/png"))
      : null;
    if (blob) {
      l.href = URL.createObjectURL(blob);
      l.addEventListener("click", () => setTimeout(() => URL.revokeObjectURL(l.href), 1000), { once: true });
    } else {
      l.href = cv.toDataURL("image/png");
    }
    document.body.appendChild(l);
    l.click();
    l.remove();
  });
  
  let dp;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    dp = e;
  });
  
  document.getElementById("pwa").onclick = () => {
    if(dp) {
      dp.prompt();
      dp = null;
    } else {
      toast("Usa Compartir → Añadir a pantalla de inicio");
    }
  };
}
</script>
</body>
</html>
