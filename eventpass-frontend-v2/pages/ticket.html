<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020618">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.json">
  <title>Tu pase — EventPass</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header class="app-header">
  <div class="header-inner" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px;">
    <!-- Logo funciona como botón de regreso al inicio -->
    <a href="../index.html" class="logo" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
      <span class="logo-icon">◈</span>
      <span class="logo-text">EventPass</span>
    </a>
    
    <div id="connection-status" class="status-online" style="font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap;">
      ● En línea
    </div>
  </div>
</header>

<main class="wrap narrow">
  <div class="panel ticket" id="t"></div>
</main>

<script src="../js/qrcode.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api-store.js"></script>
<script src="../js/app.js"></script>
<script>
const ticketElement = document.getElementById("t");
if (typeof EPStore === "undefined") {
  ticketElement.innerHTML = `<p class="err" role="alert">No se cargó js/api-store.js, revisa la consola</p>`;
} else {
const {esc,param,toast} = EPUtil;
const t = ticketElement;
const ticketId = param("id");

async function renderTicket() {
  if (!ticketId) {
    t.innerHTML = `<h1>Pase no encontrado</h1><p class="meta">No se proporcionó un identificador de pase válido.</p>`;
    return;
  }

  t.innerHTML = `<div class="empty">Buscando tu pase...</div>`;
  let a, ev;
  try {
    a = await EPStore.fetchAsistente(ticketId);
    ev = a && (typeof a.evento === "object" ? a.evento : await EPStore.fetchEvento(a.eventoId || a.evento));
  } catch (error) {
    t.innerHTML = `<h1>No se pudo cargar el pase</h1><p class="meta">${esc(error.message || "Comprueba tu conexión e inténtalo de nuevo.")}</p>`;
    return;
  }

  if(!a || !ev) {
    t.innerHTML = `<h1>Pase no encontrado</h1><p class="meta">Vuelve al link de registro del evento para generar uno.</p>`;
    return;
  }

  if (!a.pin) {
    t.innerHTML = `<h1>Pase sin PIN válido</h1><p class="meta">El servidor no proporcionó un PIN de entrada. Contacta con la organización para verificar tu registro.</p>`;
    return;
  }
  const pinCode = a.pin;
  const nombreEvento = ev.titulo || ev.nombre || "Evento";
  const lugarEvento = ev.lugar || ev.ubicacion || "";
  const fechaEvento = ev.fecha ? " · " + new Date(ev.fecha).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short"}) : "";

  t.innerHTML = `
    <span class="logo-icon">◈</span><div class="meta">${esc(nombreEvento)}</div>
    <h1>${esc(a.nombre)}</h1><div class="meta">CC ${esc(a.cedula)}</div>
    <div class="tear"></div>
    <div class="qr-container" style="background: #ffffff; padding: 12px; border-radius: 12px; display: inline-block; margin: 16px auto; box-shadow: 0 4px 14px rgba(0,0,0,0.25);">
      <canvas id="qr-canvas" aria-label="Código QR del pase" style="display: block; margin: 0 auto; border-radius: 0;"></canvas>
    </div>
    <p id="qr-status" class="meta" role="status" aria-live="polite">Generando código QR…</p>
    <div class="pin-row">
      <div><span class="meta">PIN de entrada</span><strong class="pin-code" id="pin-code">${esc(pinCode)}</strong></div>
      <button class="btn-secondary btn-sm" id="copy-pin" type="button">Copiar PIN</button>
    </div>
    <p class="meta">${esc(lugarEvento)}${esc(fechaEvento)}<br>Pase ${esc(a.pin || a.id)}</p>
    <div class="no-print" style="margin-top: 18px;">
      <button class="btn-primary" id="btn-pdf" type="button" disabled style="width: 100%; margin-bottom: 10px; font-weight: 700;">
        Descargar Comprobante Oficial (PDF)
      </button>
      <div class="row" style="justify-content: center; gap: 8px;">
        <button class="btn-secondary btn-sm" id="dl" type="button" disabled>Descargar QR (PNG)</button>
        <button class="btn-secondary btn-sm" id="pwa">Guardar en inicio</button>
      </div>
    </div>
    <a href="../index.html" class="btn-secondary no-print" style="display: block; width: 100%; text-align: center; margin-top: 24px; padding: 12px; text-decoration: none; border-radius: 8px; box-sizing: border-box;">
      ← Volver al inicio
    </a>
  `;
  
  const cv = document.getElementById("qr-canvas");
  const qrStatus = document.getElementById("qr-status");
  const downloadButton = document.getElementById("dl");
  const pdfButton = document.getElementById("btn-pdf");
  const qrPromise = new Promise((resolve, reject) => {
    if (!window.QRCode || typeof window.QRCode.toCanvas !== "function") {
      reject(new Error("La librería QRCode.js no está disponible."));
      return;
    }
    window.QRCode.toCanvas(cv, EPStore.qrPayload(a), {
      width: 240,
      margin: 4,
      errorCorrectionLevel: 'M',
      color: { dark: "#000000", light: "#ffffff" }
    }, error => error ? reject(error) : resolve());
  }).then(() => {
    qrStatus.hidden = true;
    downloadButton.disabled = false;
    if (pdfButton) pdfButton.disabled = false;
  }).catch(error => {
    console.error("Error generando QR:", error);
    qrStatus.textContent = "No se pudo generar el QR. Comprueba tu conexión e inténtalo de nuevo.";
  });

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (error) {
      // Prueba el método compatible con navegadores sin permiso de Clipboard API.
    }

    const field = document.createElement("textarea");
    field.value = text;
    field.setAttribute("readonly", "");
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand("copy");
    field.remove();
    return copied;
  }

  document.getElementById("copy-pin").addEventListener("click", async () => {
    if (await copyText(pinCode)) toast("PIN copiado");
    else prompt("Copia el PIN:", pinCode);
  });

  // Generador de Voucher PDF Oficial
  pdfButton.addEventListener("click", async () => {
    await qrPromise;
    if (pdfButton.disabled) return;

    if (!window.jspdf || !window.jspdf.jsPDF) {
      toast("Cargando motor PDF, reintenta en un segundo...");
      return;
    }

    try {
      pdfButton.disabled = true;
      pdfButton.textContent = "Generando PDF...";

      const { jsPDF } = window.jspdf;
      // Formato vertical tipo credencial (105mm x 175mm)
      const doc = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: [105, 175]
      });

      // 1. Cabecera institucional
      doc.setFillColor(2, 6, 24);
      doc.rect(0, 0, 105, 26, "F");

      doc.setFillColor(0, 220, 130);
      doc.rect(0, 26, 105, 2, "F");

      doc.setFont("helvetica", "bold");
      doc.setFontSize(15);
      doc.setTextColor(255, 255, 255);
      doc.text("EventPass", 52.5, 12, { align: "center" });

      doc.setFontSize(7.5);
      doc.setTextColor(0, 220, 130);
      doc.text("COMPROBANTE OFICIAL DE ACCESO", 52.5, 19, { align: "center" });

      // 2. Información del Evento
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.setTextColor(15, 23, 42);
      const tituloLineas = doc.splitTextToSize(nombreEvento, 85);
      doc.text(tituloLineas, 52.5, 35, { align: "center" });

      let currentY = 35 + (tituloLineas.length * 5);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.setTextColor(100, 116, 139);
      if (lugarEvento) {
        doc.text(lugarEvento, 52.5, currentY, { align: "center" });
        currentY += 4.5;
      }
      if (fechaEvento) {
        doc.text(fechaEvento.replace(/^ · /, ""), 52.5, currentY, { align: "center" });
        currentY += 5;
      }

      // 3. Tarjeta de Asistente
      const cardY = Math.max(currentY + 2, 50);
      doc.setFillColor(248, 250, 252);
      doc.setDrawColor(203, 213, 225);
      doc.roundedRect(10, cardY, 85, 28, 3, 3, "FD");

      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      doc.setTextColor(100, 116, 139);
      doc.text("DATOS DEL ASISTENTE", 15, cardY + 6.5);

      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      doc.setTextColor(15, 23, 42);
      doc.text(doc.splitTextToSize(a.nombre || "Asistente", 75), 15, cardY + 12.5);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.setTextColor(71, 85, 105);
      doc.text(`Cédula: CC ${a.cedula || "No registrada"}`, 15, cardY + 18.5);
      if (a.correo || a.email) {
        doc.text(`Correo: ${a.correo || a.email}`, 15, cardY + 23.5);
      }

      // 4. Código QR Centrado
      const qrY = cardY + 31;
      const qrDataUrl = cv.toDataURL("image/png");
      doc.addImage(qrDataUrl, "PNG", 29.5, qrY, 46, 46);

      // 5. PIN de Entrada
      const pinY = qrY + 49;
      doc.setFillColor(241, 245, 249);
      doc.setDrawColor(0, 220, 130);
      doc.roundedRect(15, pinY, 75, 13, 2, 2, "FD");

      doc.setFont("helvetica", "normal");
      doc.setFontSize(7);
      doc.setTextColor(100, 116, 139);
      doc.text("PIN DE VALIDACIÓN EN PUERTA", 52.5, pinY + 4.5, { align: "center" });

      doc.setFont("courier", "bold");
      doc.setFontSize(12);
      doc.setTextColor(2, 6, 24);
      doc.text(pinCode, 52.5, pinY + 10, { align: "center" });

      // 6. Pie de Página
      doc.setFont("helvetica", "normal");
      doc.setFontSize(6.5);
      doc.setTextColor(148, 163, 184);
      doc.setDrawColor(226, 232, 240);
      doc.line(12, 159, 93, 159);

      doc.text("Presenta este comprobante impreso o en tu pantalla en el acceso.", 52.5, 163, { align: "center" });
      doc.text(`Emitido: ${new Date().toLocaleString("es-CO")} · ID: ${a.pin || a.id}`, 52.5, 167, { align: "center" });

      const fileId = String(a.cedula || a.pin || "ticket").replace(/[^a-z0-9_-]/gi, "-");
      doc.save(`voucher-eventpass-${fileId}.pdf`);
      toast("Comprobante PDF descargado");
    } catch (err) {
      console.error("[PDF Error]", err);
      toast("Error al generar el comprobante PDF");
    } finally {
      pdfButton.disabled = false;
      pdfButton.textContent = "Descargar Comprobante Oficial (PDF)";
    }
  });

  downloadButton.addEventListener("click", async () => {
    await qrPromise;
    if (downloadButton.disabled) return;

    const l = document.createElement("a");
    const fileId = String(a.cedula || a.id).replace(/[^a-z0-9_-]/gi, "-");
    l.download = `pase-${fileId}.png`;
    const blob = typeof cv.toBlob === "function"
      ? await new Promise(resolve => cv.toBlob(resolve, "image/png"))
      : null;
    if (blob) {
      l.href = URL.createObjectURL(blob);
      l.addEventListener("click", () => setTimeout(() => URL.revokeObjectURL(l.href), 1000), { once: true });
    } else {
      l.href = cv.toDataURL("image/png");
    }
    document.body.appendChild(l);
    l.click();
    l.remove();
  });
  
  let dp;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    dp = e;
  });
  
  document.getElementById("pwa").onclick = () => {
    if(dp) {
      dp.prompt();
      dp = null;
    } else {
      toast("Usa Compartir → Añadir a pantalla de inicio");
    }
  };
}
renderTicket();
}
</script>
</body>
</html>
