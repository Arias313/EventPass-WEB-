<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scanner QR — EventPass</title>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <a href="../index.html" class="back-link" style="text-decoration: none; color: inherit;">
        <span class="logo-icon">◈</span>
        <span class="logo-text">EventPass</span>
      </a>
      <div id="connection-status" class="status-online">● En línea</div>
    </div>
  </header>

  <main class="page-container" style="max-width: 600px; margin: 0 auto; padding: 1.5rem;">
    <a href="../index.html" style="font-size: 0.85rem; color: #94a3b8; text-decoration: none; display: inline-block; margin-bottom: 1rem;">← Volver al inicio</a>
    
    <h1 class="page-title" style="margin-bottom: 1.5rem;">Escanear <span>Pase QR</span></h1>

    <!-- Contenedor del lector de cámara -->
    <div class="card" style="padding: 1rem; margin-bottom: 1.5rem; text-align: center;">
      <div id="reader" style="width: 100%; border-radius: 8px; overflow: hidden; background: #000;"></div>
      <button id="btn-toggle-camara" class="btn-primary" style="margin-top: 1rem; width: 100%; padding: 0.75rem;">Iniciar Cámara</button>
      <p id="camara-ayuda" style="margin: 0.75rem 0 0; font-size: 0.8rem; color: #94a3b8;">La cámara necesita HTTPS o localhost y permiso del navegador.</p>
    </div>

    <!-- Ingreso Manual de Código -->
    <div class="card" style="padding: 1.25rem; margin-bottom: 1.5rem;">
      <h3 style="margin-bottom: 0.75rem; font-size: 1rem;">Ingreso Manual de Código</h3>
      <form id="form-manual" action="#" onsubmit="return false;" style="display: flex; gap: 0.5rem;">
        <input type="text" id="input-codigo" placeholder="Ej. EP-A1B2C3D4" style="flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff;" />
        <button type="submit" class="btn-primary" style="padding: 0.75rem 1.25rem; border-radius: 8px;">Validar</button>
      </form>
    </div>

    <!-- Resultado / Feedback del Escaneo -->
    <div id="feedback-escaneo" class="card" style="display: none; padding: 1.5rem; text-align: center;">
      <div id="status-icon" style="font-size: 2.5rem; margin-bottom: 0.5rem;"></div>
      <h2 id="status-titulo" style="margin-bottom: 0.25rem;">-</h2>
      <p id="status-mensaje" style="color: #94a3b8; margin-bottom: 1rem;">-</p>
      
      <!-- Detalle del Asistente -->
      <div id="asistente-info" style="display: none; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; text-align: left;">
        <p><strong>Asistente:</strong> <span id="info-nombre">-</span></p>
        <p><strong>Email:</strong> <span id="info-email">-</span></p>
        <p><strong>Empresa:</strong> <span id="info-empresa">-</span></p>
      </div>
    </div>
  </main>

  <!-- Librería HTML5 QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <!-- Scripts del proyecto -->
  <script src="../js/config.js"></script>
  <script src="../js/api-store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/qr-scanner.js"></script>
</body>
</html>
