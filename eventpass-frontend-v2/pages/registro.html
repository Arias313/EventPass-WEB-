<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020618"><link rel="manifest" href="../manifest.json">
<title>Registro — EventPass</title><link rel="stylesheet" href="../css/main.css">
</head><body>
<header class="app-header">
  <div class="header-inner" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px;">
    <!-- Logo funciona como botón de regreso al inicio -->
    <a href="../index.html" class="logo" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
      <span class="logo-icon">◈</span>
      <span class="logo-text">EventPass</span>
    </a>
    
    <div id="connection-status" class="status-online" style="font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap;">
      ● En línea
    </div>
  </div>
</header>

<main class="wrap narrow"><div class="panel" id="box"></div></main>
<script src="../js/config.js"></script><script src="../js/api-store.js"></script><script src="../js/app.js"></script>
<script>
const box=document.getElementById("box");
if (typeof EPStore === "undefined") {
  box.innerHTML=`<p class="err" role="alert">No se cargó js/api-store.js, revisa la consola</p>`;
} else {
const {esc,param}=EPUtil,id=param("evento");

async function init() {
  if (!id) {
    box.innerHTML=`<h1 style="margin-top:0">Enlace incompleto</h1><p style="color:var(--color-muted-fog)">Falta el identificador del evento en la URL.</p>`;
    return;
  }

  box.innerHTML=`<div class="empty">Cargando información del evento...</div>`;
  const ev = await EPStore.fetchEvento(id);

  if(!ev){
    box.innerHTML=`<h1 style="margin-top:0">Evento no encontrado</h1><p style="color:var(--color-muted-fog)">Revisa que el link esté completo o pide uno nuevo al organizador.</p>`;
    return;
  }

  const o=EPStore.ocupacion(id),lleno=o.aforo!=null&&o.n>=o.aforo;
  box.innerHTML=`<h1 style="margin:0 0 4px">${esc(ev.nombre)}</h1>
  <p style="color:var(--color-muted-fog);margin:0 0 8px">${esc(ev.lugar)}${ev.fecha?" · "+new Date(ev.fecha).toLocaleString("es-CO",{dateStyle:"long",timeStyle:"short"}):""}</p>
  <div class="bar"><i style="width:${o.pct}%"></i></div><small style="color:var(--color-muted-fog)">${o.aforo==null?"Aforo por confirmar":o.aforo-o.n>0?(o.aforo-o.n)+" cupos disponibles":"Sin cupos disponibles"}</small>
  <form id="f" novalidate>
    <label for="n">Nombre completo</label><input id="n" autocomplete="name" required>
    <label for="c">Cédula</label><input id="c" inputmode="numeric" required>
    <label for="m">Correo electrónico</label><input id="m" type="email" autocomplete="email" required>
    <div class="err" id="e"></div>
    <button class="btn-primary" ${lleno?"disabled":""}>${lleno?"Evento lleno":"Obtener mi Pase QR"}</button>
  </form>`;

  const form=document.getElementById("f"),nameInput=document.getElementById("n"),idInput=document.getElementById("c"),emailInput=document.getElementById("m"),error=document.getElementById("e");
  form.addEventListener("input",()=>{error.textContent=""});
  form.onsubmit=async e=>{
    e.preventDefault();
    const nombre=nameInput.value.trim(),cedula=idInput.value.replace(/\D/g,""),correo=emailInput.value.trim(),er=error;
    if(nombre.length<3)return er.textContent="Escribe tu nombre completo.";
    if(cedula.length<5||cedula.length>12)return er.textContent="La cédula debe tener entre 5 y 12 dígitos.";
    if(!/^\S+@\S+\.\S+$/.test(correo))return er.textContent="Escribe un correo válido.";
    try{
      er.textContent="Generando tu pase...";
      const a=await EPStore.registrar(id,{nombre,cedula,correo});
      location.href="ticket.html?id="+encodeURIComponent(a.pin||a.id||a._id);
    } catch(x){
      er.textContent=x.message||"Error al registrarse";
    }
  };
}

init().catch(error=>{
  box.innerHTML=`<h1>No se pudo cargar el evento</h1><p style="color:var(--color-muted-fog)">${esc(error.message||"Comprueba tu conexión e inténtalo de nuevo.")}</p>`;
});
}
</script></body></html>
